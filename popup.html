<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tabstash</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Tabstash</h1>
      <section aria-labelledby="save-heading">
        <h2 id="save-heading">Save tabs</h2>
        <button id="save-current" type="button">Current window</button>
        <button id="save-all" type="button">All windows</button>
      </section>
      <section aria-labelledby="restore-heading">
        <h2 id="restore-heading">Restore tabs</h2>
        <button id="choose-file" type="button">Choose JSON file</button>
        <input id="file-input" type="file" accept=".json,application/json" hidden>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
